name: "RUNALYZE Server"
version: "0.1.12"
slug: "runalyze"
description: "Self-hosted RUNALYZE Open Source server for Home Assistant"
url: "https://github.com/binbashmedium/runalyze-ha-addon"
arch:
  - amd64
  - aarch64
startup: services
boot: auto
init: false
hassio_api: true
services:
  - mysql:need
ingress: true
ingress_port: 8099
panel_icon: mdi:run-fast
panel_title: RUNALYZE
webui: "http://[HOST]:[PORT:8099]/"
ports:
  8099/tcp: 8099
ports_description:
  8099/tcp: "RUNALYZE web interface"
options:
  db_use_supervisor_service: false
  db_host: core-mariadb
  db_port: 3306
  db_name: runalyze
  db_user: runalyze
  db_password: ""
  db_create: false
schema:
  db_use_supervisor_service: bool
  db_host: str
  db_port: port
  db_name: str
  db_user: str
  db_password: password
  db_create: bool
backup: cold
watchdog: "http://[HOST]:[PORT:8099]/"
build: .
