<VirtualHost *:80>
    ServerName localhost
    DocumentRoot /var/www/runalyze/web

    <Directory /var/www/runalyze/web>
        Options FollowSymLinks
        AllowOverride All
        Require all granted
        DirectoryIndex app.php index.php
    </Directory>

    <Directory /var/www/runalyze>
        Require all denied
    </Directory>

    ErrorLog ${APACHE_LOG_DIR}/runalyze_error.log
    CustomLog ${APACHE_LOG_DIR}/runalyze_access.log combined
</VirtualHost>
